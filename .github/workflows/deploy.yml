name: Deploy

# Deploys to imrnes over SSH after CI is green. The key in authorized_keys runs
# /usr/local/bin/gh-actions-bridge as a FORCED COMMAND, so this workflow cannot
# obtain a shell on the host even if the runner token leaks: the allowlist is the
# deploy script plus two read-only probes. `.env` (NodeBB master token, Discord bot
# token) is not readable through it.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: discord-forum-bridge-deploy-${{ github.ref }}
  # Never cancel: the deploy restarts the bridge, and an aborted restart leaves it
  # between two releases with its mirror cursors half-written.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to imrnes
    runs-on: ubuntu-latest
    # Deploy lives in this workflow, so it cannot `needs:` the CI job that runs in
    # .github/workflows/ci.yml - GitHub only links jobs inside one workflow file.
    # The ordering guarantee is instead that CI is a required status check on
    # master, plus the `production` environment gate below.
    environment: production
    # `runner.*` context is not available in job-level `env:` - referencing it here
    # makes the whole workflow invalid, and GitHub reports that as a failed run with
    # zero jobs rather than as a schema error. It is declared per step instead.
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the deploy key
        # The key is written by redirection rather than echoed through a pipe, so it
        # never appears in any process's argv. `mkdir` first because `~/.ssh` does
        # not exist on a fresh runner and `install` does not create parents.
        #
        # DEPLOY_KEY is declared on every step that uses it rather than once at job
        # level: `runner.temp` is not available in job-level `env:`, and referencing
        # it there makes the workflow invalid in a way GitHub reports as a failed run
        # with zero jobs instead of as a schema error.
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$DEPLOY_KEY"
          chmod 600 "$DEPLOY_KEY"
          # A malformed key fails here rather than inside ssh with exit 255.
          ssh-keygen -y -f "$DEPLOY_KEY" >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # A hosted runner has no route to 100.64.0.0/10, so VPS_HOST is the PUBLIC IP
      # by design.
      - name: Verify the host is reachable and the restriction holds
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          # An allowlisted, meaningful command. `true` is NOT in the allowlist and
          # would be refused, which reads as "cannot SSH" when the key is fine.
          ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
              "root@$VPS_HOST" "status"

          # Negative control: the forced command must refuse a shell. If this ever
          # succeeds the key is NOT restricted and the deploy must not proceed.
          if ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
               "root@$VPS_HOST" "id" 2>/dev/null; then
            echo "::error::the deploy key obtained a shell - refusing to deploy"
            exit 1
          fi
          echo "key is restricted to the deploy allowlist (shell refused as expected)"

      - name: Record the mirror state before deploying
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          # Captured before the deploy so the check afterwards compares against the
          # real previous value rather than an assumed minimum.
          ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
              "root@$VPS_HOST" "state" > "$RUNNER_TEMP/state-before.json"
          node -e '
            const s = require(process.env.RUNNER_TEMP + "/state-before.json");
            console.log(
              "cursors before: " + Object.keys(s.topicCursors || {}).length +
              ", threads before: " + Object.keys(s.threads || {}).length
            );
          '

      - name: Deploy
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
              "root@$VPS_HOST" "deploy"

      - name: Verify the bridge came back with its state intact
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          # An independent read-back, because the deploy script's own word is not
          # proof: a lost state.json makes the next poll re-mirror whole topic
          # histories into Discord, and that is the failure worth catching here.
          status=$(ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
                     "root@$VPS_HOST" "unit")
          echo "bridge unit: $status"
          [ "$status" = "active" ] || { echo "::error::bridge is $status after deploy"; exit 1; }

          ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 \
              "root@$VPS_HOST" "state" > "$RUNNER_TEMP/state-after.json"
          node -e '
            const before = require(process.env.RUNNER_TEMP + "/state-before.json");
            const after = require(process.env.RUNNER_TEMP + "/state-after.json");
            const count = (s, k) => Object.keys(s[k] || {}).length;
            const b = { c: count(before, "topicCursors"), t: count(before, "threads") };
            const a = { c: count(after, "topicCursors"), t: count(after, "threads") };
            console.log(`cursors: ${b.c} -> ${a.c}, threads: ${b.t} -> ${a.t}`);
            // A shrink means cursors were lost, which floods Discord on the next
            // poll. Growth is normal - a topic may have been mirrored during the
            // deploy - so asserting equality would fail a healthy run.
            if (a.c < b.c || a.t < b.t) {
              console.error("::error::mirror state shrank across the deploy - the next poll would re-mirror history");
              process.exit(1);
            }
          '

      - name: Clean up the key
        if: always()
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy_key
        run: rm -f "$DEPLOY_KEY"
